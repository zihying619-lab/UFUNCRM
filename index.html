<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 禁止搜尋引擎索引與爬取 -->
    <meta name="robots" content="noindex, nofollow">
    <title>房產 CRM 客戶管理系統 (手機優化版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示套件 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif; }
        .tab-btn.active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: bold; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-20 md:pb-6">

    <!-- 密碼驗證彈出視窗 (密碼: 0605888) -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center space-y-4 border border-slate-200">
            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h3 class="text-lg font-bold text-slate-800">歡迎使用 CRM 系統</h3>
                <p class="text-xs text-slate-500 mt-1">請輸入通行密碼以存取客戶資料庫</p>
            </div>
            <form onsubmit="verifyPassword(event)" class="space-y-3">
                <div>
                    <input type="password" id="passInput" required placeholder="請輸入密碼" class="w-full px-4 py-3 border rounded-xl text-center text-base tracking-widest focus:ring-2 focus:ring-blue-500 outline-none">
                    <p id="passError" class="text-xs text-red-500 font-semibold mt-1.5 hidden"><i class="fa-solid fa-circle-exclamation"></i> 密碼錯誤，請重新輸入！</p>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-md">
                    確認解鎖
                </button>
            </form>
        </div>
    </div>

    <!-- 主要系統介面 (預設隱藏，解鎖後顯示) -->
    <div id="appContent" class="hidden">
        <!-- 上方導覽列 -->
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <h1 class="text-base md:text-lg font-bold tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-house-chimney text-blue-400"></i>
                    房產 CRM 管理系統
                </h1>
                <div class="flex items-center gap-2">
                    <span class="text-[11px] bg-emerald-600 text-white px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm font-semibold">
                        <i class="fa-solid fa-wifi text-[9px]"></i> 同步中
                    </span>
                    <button onclick="logoutPass()" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700 flex items-center gap-1" title="鎖定系統">
                        <i class="fa-solid fa-lock text-[9px]"></i> 鎖定
                    </button>
                </div>
            </div>
        </header>

        <!-- 主要內容區 -->
        <main class="max-w-7xl mx-auto px-3 md:px-6 py-3">

            <!-- 電腦版頁籤切換 -->
            <div class="hidden md:flex border-b border-slate-300 mb-4 bg-white rounded-t-xl px-4 pt-1 shadow-sm justify-between items-center">
                <div class="flex">
                    <button id="btnTabSeller" onclick="switchTab('seller')" class="tab-btn active px-5 py-2.5 text-sm text-slate-600 hover:text-blue-600 flex items-center gap-2">
                        <i class="fa-solid fa-key"></i> 賣方 (屋主/開發物件)
                    </button>
                    <button id="btnTabBuyer" onclick="switchTab('buyer')" class="tab-btn px-5 py-2.5 text-sm text-slate-600 hover:text-blue-600 flex items-center gap-2">
                        <i class="fa-solid fa-user-tag"></i> 買方 (客源/購屋需求)
                    </button>
                </div>
            </div>

            <!-- ==================== 1. 賣方模組 ==================== -->
            <div id="sectionSeller" class="space-y-3">
                
                <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-1.5 flex-1 min-w-[200px]">
                            <input type="text" id="filterHousehold" oninput="renderSellers()" placeholder="🔍 搜尋戶籍地 (北屯/彰化)" class="px-3 py-2 border border-slate-300 rounded-lg text-xs w-full focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>

                        <div class="flex items-center gap-2">
                            <button type="button" onclick="exportSelectedSellersCSV()" class="text-xs bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-2 rounded-lg font-semibold flex items-center gap-1 shadow-sm whitespace-nowrap">
                                <i class="fa-solid fa-file-excel"></i> <span id="btnExportSellerText">匯出勾選項目 (0)</span>
                            </button>
                            <button type="button" onclick="toggleSellerForm()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg font-semibold flex items-center gap-1 shadow-sm whitespace-nowrap">
                                <i class="fa-solid fa-plus"></i> <span id="btnToggleSellerText">新增賣方</span>
                            </button>
                        </div>
                    </div>

                    <div id="collapsibleSellerForm" class="hidden pt-3 mt-3 border-t border-slate-100">
                        <form id="formSeller" onsubmit="addSeller(event)" class="grid grid-cols-1 md:grid-cols-6 gap-2.5">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">稱呼</label>
                                <input type="text" id="sName" placeholder="如: 林小姐" class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">電話</label>
                                <input type="tel" id="sPhone" placeholder="09xx-xxx-xxx" class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">社區</label>
                                <input type="text" id="sCommunity" placeholder="如: 自在柳陽" class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">房屋地址</label>
                                <input type="text" id="sAddress" placeholder="台中市北屯區..." class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">戶籍地</label>
                                <input type="text" id="sHousehold" placeholder="彰化縣社頭鄉..." class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">參考連結</label>
                                <input type="url" id="sLink" placeholder="591/網址..." class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div class="md:col-span-6 flex justify-end gap-2 pt-2">
                                <button type="button" onclick="toggleSellerForm()" class="px-4 py-2 text-xs bg-slate-200 text-slate-600 rounded-lg">取消</button>
                                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-xs font-semibold shadow-sm">儲存送出</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 賣方客戶列表區域 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-3 bg-slate-50 border-b border-slate-200 font-bold text-slate-700 flex justify-between items-center text-xs">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="selectAllSellers" onchange="toggleSelectAllSellers(this.checked)" class="w-4 h-4 cursor-pointer accent-blue-600">
                            <label for="selectAllSellers" class="cursor-pointer select-none">全選 / 賣方列表</label>
                        </div>
                        <span id="sellerCount" class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">0 筆</span>
                    </div>

                    <!-- 手機版卡片列表 -->
                    <div id="sellerMobileCards" class="block md:hidden divide-y divide-slate-100"></div>

                    <!-- 電腦版表格 -->
                    <div class="hidden md:block overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead class="bg-slate-100 text-slate-600 text-xs uppercase sticky top-0">
                                <tr>
                                    <th class="p-2.5 whitespace-nowrap w-8"></th>
                                    <th class="p-2.5 whitespace-nowrap w-8">
                                        <input type="checkbox" id="selectAllSellersTable" onchange="toggleSelectAllSellers(this.checked)" class="w-4 h-4 cursor-pointer accent-blue-600">
                                    </th>
                                    <th class="p-2.5 whitespace-nowrap">稱呼</th>
                                    <th class="p-2.5 whitespace-nowrap">電話</th>
                                    <th class="p-2.5 whitespace-nowrap">社區</th>
                                    <th class="p-2.5 whitespace-nowrap">最新狀態</th>
                                    <th class="p-2.5 whitespace-nowrap">聯繫/拜訪日期</th>
                                    <th class="p-2.5 whitespace-nowrap min-w-[180px]">房屋地址</th>
                                    <th class="p-2.5 whitespace-nowrap min-w-[200px]">戶籍地</th>
                                    <th class="p-2.5 whitespace-nowrap">相關連結</th>
                                    <th class="p-2.5 whitespace-nowrap">操作</th>
                                </tr>
                            </thead>
                            <tbody id="sellerTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ==================== 2. 買方模組 ==================== -->
            <div id="sectionBuyer" class="space-y-3 hidden">
                
                <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2 flex-1 min-w-[200px]">
                            <input type="text" id="filterBuyerNeed" oninput="renderBuyers()" placeholder="🔍 搜尋需求 (如: 3房)" class="px-3 py-2 border border-slate-300 rounded-lg text-xs w-full focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>

                        <div class="flex items-center gap-2">
                            <button type="button" onclick="exportSelectedBuyersCSV()" class="text-xs bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-2 rounded-lg font-semibold flex items-center gap-1 shadow-sm whitespace-nowrap">
                                <i class="fa-solid fa-file-excel"></i> <span id="btnExportBuyerText">匯出勾選項目 (0)</span>
                            </button>
                            <button type="button" onclick="toggleBuyerForm()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg font-semibold flex items-center gap-1 shadow-sm whitespace-nowrap">
                                <i class="fa-solid fa-plus"></i> <span id="btnToggleBuyerText">新增買方</span>
                            </button>
                        </div>
                    </div>

                    <div id="collapsibleBuyerForm" class="hidden pt-3 mt-3 border-t border-slate-100">
                        <form id="formBuyer" onsubmit="addBuyer(event)" class="grid grid-cols-1 md:grid-cols-5 gap-2.5">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">稱呼</label>
                                <input type="text" id="bName" placeholder="如: 陳先生" class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">電話</label>
                                <input type="tel" id="bPhone" placeholder="09xx-xxx-xxx" class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">找屋需求</label>
                                <input type="text" id="bCommunities" placeholder="如: 3房電梯、自在柳陽" class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">預算區間 (萬)</label>
                                <div class="flex items-center gap-1">
                                    <input type="number" id="bMinBudget" placeholder="最低" class="w-full px-2 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                                    <span class="text-slate-400 text-xs">~</span>
                                    <input type="number" id="bMaxBudget" placeholder="最高" class="w-full px-2 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                                </div>
                            </div>
                            <div class="flex items-end justify-end gap-2 pt-2">
                                <button type="button" onclick="toggleBuyerForm()" class="px-4 py-2 text-xs bg-slate-200 text-slate-600 rounded-lg">取消</button>
                                <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded-lg text-xs font-semibold shadow-sm">儲存送出</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 買方客戶列表區域 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-3 bg-slate-50 border-b border-slate-200 font-bold text-slate-700 flex justify-between items-center text-xs">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="selectAllBuyers" onchange="toggleSelectAllBuyers(this.checked)" class="w-4 h-4 cursor-pointer accent-emerald-600">
                            <label for="selectAllBuyers" class="cursor-pointer select-none">全選 / 買方清單</label>
                        </div>
                        <span id="buyerCount" class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">0 筆</span>
                    </div>

                    <!-- 手機版卡片列表 -->
                    <div id="buyerMobileCards" class="block md:hidden divide-y divide-slate-100"></div>

                    <!-- 電腦版表格 -->
                    <div class="hidden md:block overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead class="bg-slate-100 text-slate-600 text-xs uppercase sticky top-0">
                                <tr>
                                    <th class="p-2.5 whitespace-nowrap w-8"></th>
                                    <th class="p-2.5 whitespace-nowrap w-8">
                                        <input type="checkbox" id="selectAllBuyersTable" onchange="toggleSelectAllBuyers(this.checked)" class="w-4 h-4 cursor-pointer accent-emerald-600">
                                    </th>
                                    <th class="p-2.5 whitespace-nowrap">稱呼</th>
                                    <th class="p-2.5 whitespace-nowrap">電話</th>
                                    <th class="p-2.5 whitespace-nowrap min-w-[150px]">找屋需求</th>
                                    <th class="p-2.5 whitespace-nowrap">預算區間</th>
                                    <th class="p-2.5 whitespace-nowrap">最新狀態</th>
                                    <th class="p-2.5 whitespace-nowrap">聯繫日期</th>
                                    <th class="p-2.5 whitespace-nowrap">操作</th>
                                </tr>
                            </thead>
                            <tbody id="buyerTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>

        <!-- 手機專用底部固定切換列 -->
        <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around items-center py-2 z-40 shadow-lg">
            <button id="mobileTabSeller" onclick="switchTab('seller')" class="flex flex-col items-center gap-1 text-blue-600 font-bold text-xs">
                <i class="fa-solid fa-key text-base"></i>
                <span>賣方客戶</span>
            </button>
            <button id="mobileTabBuyer" onclick="switchTab('buyer')" class="flex flex-col items-center gap-1 text-slate-400 text-xs">
                <i class="fa-solid fa-user-tag text-base"></i>
                <span>買方需求</span>
            </button>
        </div>
    </div>

    <!-- 編輯賣方 Modal -->
    <div id="editSellerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-end md:items-center justify-center p-0 md:p-4 z-50">
        <div class="bg-white rounded-t-2xl md:rounded-xl shadow-xl max-w-lg w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-base font-bold text-slate-800">修改賣方資料</h3>
                <button onclick="closeEditModal('seller')" class="text-slate-400 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="editSellerId">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">稱呼</label>
                    <input type="text" id="editSName" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">電話</label>
                    <input type="tel" id="editSPhone" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">社區</label>
                    <input type="text" id="editSCommunity" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">參考連結</label>
                    <input type="url" id="editSLink" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">房屋地址</label>
                    <input type="text" id="editSAddress" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">戶籍地</label>
                    <input type="text" id="editSHousehold" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-3 border-t">
                <button type="button" onclick="closeEditModal('seller')" class="px-4 py-2 text-xs bg-slate-200 text-slate-700 rounded-lg">取消</button>
                <button type="button" id="btnSaveSellerEdit" onclick="window.saveEditSeller()" class="px-5 py-2 text-xs bg-blue-600 text-white rounded-lg font-bold shadow-sm">儲存變更</button>
            </div>
        </div>
    </div>

    <!-- 編輯買方 Modal -->
    <div id="editBuyerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-end md:items-center justify-center p-0 md:p-4 z-50">
        <div class="bg-white rounded-t-2xl md:rounded-xl shadow-xl max-w-lg w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-base font-bold text-slate-800">修改買方需求資料</h3>
                <button onclick="closeEditModal('buyer')" class="text-slate-400 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="editBuyerId">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">稱呼</label>
                    <input type="text" id="editBName" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">電話</label>
                    <input type="tel" id="editBPhone" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 text-xs">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">找屋需求</label>
                    <input type="text" id="editBCommunities" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">最低預算 (萬)</label>
                    <input type="number" id="editBMinBudget" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">最高預算 (萬)</label>
                    <input type="number" id="editBMaxBudget" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 text-xs">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-3 border-t">
                <button type="button" onclick="closeEditModal('buyer')" class="px-4 py-2 text-xs bg-slate-200 text-slate-700 rounded-lg">取消</button>
                <button type="button" id="btnSaveBuyerEdit" onclick="window.saveEditBuyer()" class="px-5 py-2 text-xs bg-emerald-600 text-white rounded-lg font-bold shadow-sm">儲存變更</button>
            </div>
        </div>
    </div>

    <!-- 密碼驗證與介面控制邏輯 -->
    <script>
        const CORRECT_PASS = "0605888";
        window.selectedSellerIds = new Set();
        window.selectedBuyerIds = new Set();

        window.addEventListener('DOMContentLoaded', () => {

        function cleanCSV(text) {
            return text.replace(/"/g, '""');

        function downloadCSV(csvContent, fileName) {
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", fileName);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            if (window.editingSellerLogIdx >= 0 && window.editingSellerLogIdx < logs.length) {
                logs[window.editingSellerLogIdx].content = content;
            } else {
                const now = new Date();
                const timeStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                logs.push({ date: timeStr, content: content });

        function renderSellerLogsInlineHtml(seller) {
            if (!seller.logs || seller.logs.length === 0) {
                return `<div class="text-xs text-slate-400 text-center py-2">目前尚無紀錄，可於上方輸入框新增</div>`;

            seller.logs.slice().reverse().forEach((log, revIdx) => {
                const originalIndex = seller.logs.length - 1 - revIdx;
                html += `
                    <div class="bg-slate-50 p-2 rounded-lg border border-slate-200 text-xs">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-slate-400"><i class="fa-regular fa-clock"></i> ${log.date}</span>

                            </div>
                        </div>
                        <div class="text-slate-700 break-words">${log.content}</div>
                    </div>

        window.toggleSeller = function(id) {
            window.selectedSellerId = window.selectedSellerId === id ? null : id;
            window.editingSellerLogIdx = -1;
            window.renderSellers();
        };

        window.startEditSellerLogInline = function(sellerId, index) {
            const seller = window.sellers.find(s => s.id === sellerId);
            if (!seller || !seller.logs[index]) return;

            window.editingSellerLogIdx = index;
            const input = document.getElementById(`sLogInput_${sellerId}`);
            input.value = seller.logs[index].content;
            document.getElementById(`btnSaveSLog_${sellerId}`).innerText = '儲存修改';
            document.getElementById(`btnCancelSLog_${sellerId}`).classList.remove('hidden');
            input.focus();
        };

        window.cancelSellerLogEditInline = function(sellerId) {
            window.editingSellerLogIdx = -1;
            window.renderSellers();
        };

        // 全局渲染買方清單

            const tbody = document.getElementById('buyerTableBody');
            const mobileCards = document.getElementById('buyerMobileCards');

            if (!tbody || !mobileCards) return;
            tbody.innerHTML = '';
            mobileCards.innerHTML = '';

            let filteredBuyers = getFilteredBuyers();
            document.getElementById('buyerCount').innerText = `${filteredBuyers.length} 筆`;
            updateBuyerExportButtonText();

            filteredBuyers.forEach(b => {
                const isSelected = b.id === window.selectedBuyerId;
                const isChecked = window.selectedBuyerIds.has(b.id);

                let budgetText = '-';
                if (b.minBudget && b.maxBudget) budgetText = `${b.minBudget}~${b.maxBudget}萬`;
                else if (b.maxBudget) budgetText = `最高${b.maxBudget}萬`;
                else if (b.minBudget) budgetText = `最低${b.minBudget}萬`;

                else if (currentStatus === '已有電話') statusColorClass = 'bg-blue-100 text-blue-800 border-blue-300';

                                <span class="text-slate-400">狀態:</span>
                                <select onclick="event.stopPropagation()" onchange="changeBuyerStatus('${b.id}', this.value)" class="text-xs font-bold px-1.5 py-0.5 rounded border outline-none ${statusColorClass}">
                                    <option value="" ${currentStatus===''?'selected':''}>-- 選擇 --</option>
                                    <option value="已加line" ${currentStatus==='已加line'?'selected':''}>已加line</option>
                                    <option value="已有電話" ${currentStatus==='已有電話'?'selected':''}>已有電話</option>
                                    <option value="暫無需求" ${currentStatus==='暫無需求'?'selected':''}>暫無需求</option>

                            </div>
                        </div>

                            <span class="flex items-center gap-1">
                                <i class="fa-regular fa-comment-dots"></i> 
                                ${isSelected ? '收合帶看紀錄' : '點此展開帶看歷史紀錄 / 新增狀況'}
                            </span>
                            <i class="fa-solid ${isSelected ? 'fa-chevron-up' : 'fa-chevron-down'} text-slate-400"></i>
                        </div>

                            <div class="mt-2 pt-3 border-t border-emerald-200 bg-white p-3 rounded-xl space-y-2" onclick="event.stopPropagation()">

                                <textarea id="bLogInput_${b.id}" rows="2" placeholder="輸入帶看狀況..." class="w-full p-2 border rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>

                        <td class="p-2.5" onclick="event.stopPropagation()">

        function renderBuyerLogsInlineHtml(buyer) {
            if (!buyer.logs || buyer.logs.length === 0) {
                return `<div class="text-xs text-slate-400 text-center py-2">目前尚無紀錄，可於上方輸入框新增</div>`;

            let html = '';
            buyer.logs.slice().reverse().forEach((log, revIdx) => {

        window.toggleBuyer = function(id) {
            window.selectedBuyerId = window.selectedBuyerId === id ? null : id;
            window.editingBuyerLogIdx = -1;
            window.renderBuyers();

        window.startEditBuyerLogInline = function(buyerId, index) {
            const buyer = window.buyers.find(b => b.id === buyerId);
            if (!buyer || !buyer.logs[index]) return;

            window.editingBuyerLogIdx = index;
            const input = document.getElementById(`bLogInput_${buyerId}`);
            input.value = buyer.logs[index].content;
            document.getElementById(`btnSaveBLog_${buyerId}`).innerText = '儲存修改';
            document.getElementById(`btnCancelBLog_${buyerId}`).classList.remove('hidden');
            input.focus();
        };

        window.cancelBuyerLogEditInline = function(buyerId) {
            window.editingBuyerLogIdx = -1;
            window.renderBuyers();
        };

        window.clearBuyerFilters = function() {
            document.getElementById('filterBuyerNeed').value = '';
