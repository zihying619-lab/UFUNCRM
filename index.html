<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 禁止搜尋引擎索引與爬取 -->
    <meta name="robots" content="noindex, nofollow">
    <title>房產 CRM 客戶管理系統 (安全密碼版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示套件 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif; }
        .tab-btn.active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- 密碼驗證彈出視窗 (密碼: 8888) -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center space-y-4 border border-slate-200">
            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h3 class="text-lg font-bold text-slate-800">歡迎使用 CRM 系統</h3>
                <p class="text-xs text-slate-500 mt-1">請輸入通行密碼以存取客戶資料庫</p>
            </div>
            <form onsubmit="verifyPassword(event)" class="space-y-3">
                <div>
                    <input type="password" id="passInput" required placeholder="請輸入密碼" class="w-full px-4 py-2.5 border rounded-xl text-center text-base tracking-widest focus:ring-2 focus:ring-blue-500 outline-none">
                    <p id="passError" class="text-xs text-red-500 font-semibold mt-1.5 hidden"><i class="fa-solid fa-circle-exclamation"></i> 密碼錯誤，請重新輸入！</p>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm transition-all shadow-md">
                    確認解鎖
                </button>
            </form>
        </div>
    </div>

    <!-- 主要系統介面 (預設隱藏，解鎖後顯示) -->
    <div id="appContent" class="hidden">
        <!-- 上方導覽列 -->
        <header class="bg-slate-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
                <h1 class="text-lg font-bold tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-house-chimney text-blue-400"></i>
                    房產 CRM 客戶管理系統
                </h1>
                <div class="flex items-center gap-3">
                    <span class="text-xs bg-emerald-600 text-white px-3 py-1 rounded-full flex items-center gap-1 shadow-sm font-semibold">
                        <i class="fa-solid fa-wifi text-[10px]"></i> 雲端即時同步中
                    </span>
                    <button onclick="logoutPass()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 flex items-center gap-1" title="鎖定系統">
                        <i class="fa-solid fa-lock text-[10px]"></i> 鎖定
                    </button>
                </div>
            </div>
        </header>

        <!-- 主要內容區 -->
        <main class="max-w-7xl mx-auto px-6 py-4">

            <!-- 頁籤切換 (賣方 vs 買方) -->
            <div class="flex border-b border-slate-300 mb-4 bg-white rounded-t-xl px-4 pt-1 shadow-sm">
                <button id="btnTabSeller" onclick="switchTab('seller')" class="tab-btn active px-5 py-2.5 text-sm text-slate-600 hover:text-blue-600 flex items-center gap-2">
                    <i class="fa-solid fa-key"></i> 賣方 (屋主/開發物件)
                </button>
                <button id="btnTabBuyer" onclick="switchTab('buyer')" class="tab-btn px-5 py-2.5 text-sm text-slate-600 hover:text-blue-600 flex items-center gap-2">
                    <i class="fa-solid fa-user-tag"></i> 買方 (客源/購屋需求)
                </button>
            </div>

            <!-- ==================== 1. 賣方模組 ==================== -->
            <div id="sectionSeller" class="space-y-4">
                
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-slate-700 whitespace-nowrap"><i class="fa-solid fa-filter text-blue-500"></i> 戶籍地篩選：</span>
                            <input type="text" id="filterHousehold" oninput="renderSellers()" placeholder="輸入關鍵字 (如: 北屯、彰化)" class="px-3 py-1 border border-slate-300 rounded-lg text-xs w-48 focus:ring-2 focus:ring-blue-500 outline-none">
                            <button onclick="document.getElementById('filterHousehold').value=''; renderSellers();" class="text-xs text-slate-400 hover:text-slate-700 underline">清除</button>
                        </div>

                        <button type="button" onclick="toggleSellerForm()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-plus"></i> <span id="btnToggleSellerText">新增賣方資料</span>
                        </button>
                    </div>

                    <div id="collapsibleSellerForm" class="hidden pt-4 mt-3 border-t border-slate-100">
                        <form id="formSeller" onsubmit="addSeller(event)" class="grid grid-cols-1 md:grid-cols-6 gap-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">稱呼 *</label>
                                <input type="text" id="sName" required placeholder="如: 林小姐" class="w-full px-2.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">電話</label>
                                <input type="text" id="sPhone" placeholder="09xx-xxx-xxx" class="w-full px-2.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">社區 *</label>
                                <input type="text" id="sCommunity" required placeholder="如: 自在柳陽" class="w-full px-2.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">房屋地址</label>
                                <input type="text" id="sAddress" placeholder="台中市北屯區..." class="w-full px-2.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">戶籍地</label>
                                <input type="text" id="sHousehold" placeholder="彰化縣社頭鄉..." class="w-full px-2.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">參考連結</label>
                                <input type="url" id="sLink" placeholder="591/網址..." class="w-full px-2.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div class="md:col-span-6 flex justify-end gap-2 pt-1">
                                <button type="button" onclick="toggleSellerForm()" class="px-3 py-1.5 text-xs bg-slate-200 text-slate-600 rounded-lg hover:bg-slate-300">取消</button>
                                <button type="submit" class="bg-blue-600 text-white px-5 py-1.5 rounded-lg text-xs font-semibold hover:bg-blue-700 shadow-sm">儲存送出</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-3 bg-slate-50 border-b border-slate-200 font-bold text-slate-700 flex justify-between items-center text-xs">
                        <span class="flex items-center gap-2">
                            <span class="text-sm">賣方客戶清單</span>
                            <span class="font-normal text-slate-400">(點擊欄位可於下方展開/收合歷史紀錄)</span>
                        </span>
                        <span id="sellerCount" class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">0 筆</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead class="bg-slate-100 text-slate-600 text-xs uppercase sticky top-0">
                                <tr>
                                    <th class="p-2.5 whitespace-nowrap w-8"></th>
                                    <th class="p-2.5 whitespace-nowrap">稱呼</th>
                                    <th class="p-2.5 whitespace-nowrap">電話</th>
                                    <th class="p-2.5 whitespace-nowrap">社區</th>
                                    <th class="p-2.5 whitespace-nowrap">最新狀態</th>
                                    <th class="p-2.5 whitespace-nowrap">聯繫/拜訪日期</th>
                                    <th class="p-2.5 whitespace-nowrap min-w-[180px]">房屋地址</th>
                                    <th class="p-2.5 whitespace-nowrap min-w-[200px]">戶籍地</th>
                                    <th class="p-2.5 whitespace-nowrap">相關連結</th>
                                    <th class="p-2.5 whitespace-nowrap">操作</th>
                                </tr>
                            </thead>
                            <tbody id="sellerTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ==================== 2. 買方模組 ==================== -->
            <div id="sectionBuyer" class="space-y-4 hidden">
                
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <div class="flex flex-wrap items-center gap-3">
                            <span class="text-xs font-bold text-slate-700 whitespace-nowrap"><i class="fa-solid fa-filter text-emerald-500"></i> 買方快速篩選：</span>
                            <div class="flex items-center gap-1 text-xs">
                                <span class="text-slate-500">需求:</span>
                                <input type="text" id="filterBuyerNeed" oninput="renderBuyers()" placeholder="如: 3房" class="px-2.5 py-1 border border-slate-300 rounded-lg text-xs w-32 focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                            <div class="flex items-center gap-1 text-xs">
                                <span class="text-slate-500">預算(萬):</span>
                                <input type="number" id="filterBuyerMinPrice" oninput="renderBuyers()" placeholder="最低" class="px-2 py-1 border border-slate-300 rounded-lg text-xs w-20 focus:ring-2 focus:ring-emerald-500 outline-none">
                                <span class="text-slate-400">~</span>
                                <input type="number" id="filterBuyerMaxPrice" oninput="renderBuyers()" placeholder="最高" class="px-2 py-1 border border-slate-300 rounded-lg text-xs w-20 focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                            <button onclick="clearBuyerFilters()" class="text-xs text-slate-400 hover:text-slate-700 underline">清除</button>
                        </div>

                        <button type="button" onclick="toggleBuyerForm()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-plus"></i> <span id="btnToggleBuyerText">新增買方需求</span>
                        </button>
                    </div>

                    <div id="collapsibleBuyerForm" class="hidden pt-4 mt-3 border-t border-slate-100">
                        <form id="formBuyer" onsubmit="addBuyer(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">稱呼 *</label>
                                <input type="text" id="bName" required placeholder="如: 陳先生" class="w-full px-2.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">電話 *</label>
                                <input type="text" id="bPhone" required placeholder="09xx-xxx-xxx" class="w-full px-2.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">找屋需求</label>
                                <input type="text" id="bCommunities" placeholder="如: 3房電梯、自在柳陽" class="w-full px-2.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">預算區間 (萬)</label>
                                <div class="flex items-center gap-1">
                                    <input type="number" id="bMinBudget" placeholder="最低" class="w-full px-1.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                                    <span class="text-slate-400 text-xs">~</span>
                                    <input type="number" id="bMaxBudget" placeholder="最高" class="w-full px-1.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                                </div>
                            </div>
                            <div class="flex items-end justify-end gap-2">
                                <button type="button" onclick="toggleBuyerForm()" class="px-3 py-1.5 text-xs bg-slate-200 text-slate-600 rounded-lg hover:bg-slate-300">取消</button>
                                <button type="submit" class="bg-emerald-600 text-white px-5 py-1.5 rounded-lg text-xs font-semibold hover:bg-emerald-700 shadow-sm">儲存送出</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-3 bg-slate-50 border-b border-slate-200 font-bold text-slate-700 flex justify-between items-center text-xs">
                        <span class="flex items-center gap-2">
                            <span class="text-sm">買方客源清單</span>
                            <span class="font-normal text-slate-400">(點擊欄位可於下方展開/收合歷史紀錄)</span>
                        </span>
                        <span id="buyerCount" class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">0 筆</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead class="bg-slate-100 text-slate-600 text-xs uppercase sticky top-0">
                                <tr>
                                    <th class="p-2.5 whitespace-nowrap w-8"></th>
                                    <th class="p-2.5 whitespace-nowrap">稱呼</th>
                                    <th class="p-2.5 whitespace-nowrap">電話</th>
                                    <th class="p-2.5 whitespace-nowrap min-w-[150px]">找屋需求</th>
                                    <th class="p-2.5 whitespace-nowrap">預算區間</th>
                                    <th class="p-2.5 whitespace-nowrap">最新狀態</th>
                                    <th class="p-2.5 whitespace-nowrap">聯繫日期</th>
                                    <th class="p-2.5 whitespace-nowrap">操作</th>
                                </tr>
                            </thead>
                            <tbody id="buyerTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- 編輯賣方 Modal -->
    <div id="editSellerModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-slate-800 border-b pb-2">修改賣方資料</h3>
            <input type="hidden" id="editSellerId">
            <div class="grid grid-cols-2 gap-3 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">稱呼</label>
                    <input type="text" id="editSName" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">電話</label>
                    <input type="text" id="editSPhone" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">社區</label>
                    <input type="text" id="editSCommunity" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">參考連結</label>
                    <input type="url" id="editSLink" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">房屋地址</label>
                    <input type="text" id="editSAddress" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">戶籍地</label>
                    <input type="text" id="editSHousehold" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-3 border-t">
                <button type="button" onclick="closeEditModal('seller')" class="px-4 py-2 text-xs bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300">取消</button>
                <button type="button" onclick="saveEditSeller()" class="px-4 py-2 text-xs bg-blue-600 text-white rounded-lg hover:bg-blue-700">儲存變更</button>
            </div>
        </div>
    </div>

    <!-- 編輯買方 Modal -->
    <div id="editBuyerModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-slate-800 border-b pb-2">修改買方需求資料</h3>
            <input type="hidden" id="editBuyerId">
            <div class="grid grid-cols-2 gap-3 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">稱呼</label>
                    <input type="text" id="editBName" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">電話</label>
                    <input type="text" id="editBPhone" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">找屋需求</label>
                    <input type="text" id="editBCommunities" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">最低預算 (萬)</label>
                    <input type="number" id="editBMinBudget" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">最高預算 (萬)</label>
                    <input type="number" id="editBMaxBudget" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-3 border-t">
                <button type="button" onclick="closeEditModal('buyer')" class="px-4 py-2 text-xs bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300">取消</button>
                <button type="button" onclick="saveEditBuyer()" class="px-4 py-2 text-xs bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">儲存變更</button>
            </div>
        </div>
    </div>

    <!-- 密碼驗證邏輯 -->
    <script>
        const CORRECT_PASS = "8888";

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('crm_authed') === 'true') {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('appContent').classList.remove('hidden');
            }
        });

        function verifyPassword(e) {
            e.preventDefault();
            const input = document.getElementById('passInput').value;
            if (input === CORRECT_PASS) {
                localStorage.setItem('crm_authed', 'true');
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('appContent').classList.remove('hidden');
                document.getElementById('passError').classList.add('hidden');
            } else {
                document.getElementById('passError').classList.remove('hidden');
                document.getElementById('passInput').value = '';
                document.getElementById('passInput').focus();
            }
        }

        function logoutPass() {
            localStorage.removeItem('crm_authed');
            location.reload();
        }
    </script>

    <!-- Firebase 雲端資料庫 SDK 模組 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBn8AFGBMxgpkKtZI9OD7h9X8YamF9cHVk",
            authDomain: "our-crm-b805c.firebaseapp.com",
            projectId: "our-crm-b805c",
            storageBucket: "our-crm-b805c.firebasestorage.app",
            messagingSenderId: "850281025236",
            appId: "1:850281025236:web:15fcaef9b5efee94eeed5c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.sellers = [];
        window.buyers = [];
        window.selectedSellerId = null;
        window.selectedBuyerId = null;
        window.editingSellerLogIdx = -1;
        window.editingBuyerLogIdx = -1;

        // 即時監聽賣方集合
        onSnapshot(collection(db, "sellers"), (snapshot) => {
            window.sellers = [];
            snapshot.forEach(doc => window.sellers.push({ id: doc.id, ...doc.data() }));
            renderSellers();
        });

        // 即時監聽買方集合

            if (type === 'seller') {
                const s = window.sellers.find(x => x.id === id);
                if (!s) return;
                document.getElementById('editSellerId').value = s.id;
                document.getElementById('editSName').value = s.name || '';
                document.getElementById('editSPhone').value = s.phone || '';
                document.getElementById('editSCommunity').value = s.community || '';
                document.getElementById('editSAddress').value = s.address || '';
                document.getElementById('editSHousehold').value = s.household || '';
                document.getElementById('editSLink').value = s.link || '';
                document.getElementById('editSellerModal').classList.remove('hidden');
            } else {
                const b = window.buyers.find(x => x.id === id);
                if (!b) return;
                document.getElementById('editBuyerId').value = b.id;
                document.getElementById('editBName').value = b.name || '';
                document.getElementById('editBPhone').value = b.phone || '';
                document.getElementById('editBCommunities').value = b.communities || '';
                document.getElementById('editBMinBudget').value = b.minBudget || '';
                document.getElementById('editBMaxBudget').value = b.maxBudget || '';
                document.getElementById('editBuyerModal').classList.remove('hidden');
            }
        }

        function closeEditModal(type) {
            if (type === 'seller') document.getElementById('editSellerModal').classList.add('hidden');
            else document.getElementById('editBuyerModal').classList.add('hidden');
        }
    </script>
</body>
</html>
